<app-admin-header></app-admin-header>
<section class="bg-gray-50 dark:bg-gray-900 p-3 sm:p-5">
    <div class="mx-auto max-w-screen-xl px-4 lg:px-12">
        <div class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg overflow-hidden">
            <div class="flex flex-col md:flex-row items-center justify-between space-y-3 md:space-y-0 md:space-x-4 p-4">
                <div class="w-full md:w-1/2">
                   <form class="flex items-center">
  <label for="simple-search" class="sr-only">Search</label>
  <div class="relative w-full">
    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
      <svg aria-hidden="true" class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
      </svg>
    </div>
    <input
      type="text"
      [(ngModel)]="searchText"
      name="search"
      id="simple-search"
      placeholder="Search"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
    />
  </div>
</form>

                </div>
                <div class="w-full md:w-auto flex flex-col md:flex-row space-y-2 md:space-y-0 items-stretch md:items-center justify-end md:space-x-3 flex-shrink-0">
<button 
  type="button"
  (click)="openModal()"
  class="flex items-center justify-center text-white font-medium rounded-lg text-sm px-4 py-2"
  (mouseover)="isHover = true"
  (mouseout)="isHover = false"
  [style.backgroundColor]="isHover ? '#b85622' : '#d6672b'">
  <svg class="h-3.5 w-3.5 mr-2" fill="currentColor" viewBox="0 0 20 20">
    <path clip-rule="evenodd" fill-rule="evenodd"
      d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" />
  </svg>
  Add statut
</button>

<app-add-statut
  [show]="showModal"
  (close)="handleClose()"
   (statutAdded)="fetchStatuts(currentPage)">
</app-add-statut>
</div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                  <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                    <tr>
                      
                        <th scope="col" class="px-4 py-3">Id</th>
                        <th scope="col" class="px-4 py-3">label</th>
                        <th scope="col" class="px-4 py-3">color</th>
                        <th scope="col" class="px-4 py-3">Actions</th>
                    </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let statut of statuts | filterByLibelle:searchText" class="border-b dark:border-gray-700">
                      <td class="px-4 py-3">{{ statut.id }}</td>
                      <td class="px-4 py-3">{{ statut.libelle }}</td>
                      <td class="px-4 py-3"><span [ngStyle]="{'background-color': statut.couleur, width: '16px',height: '16px','border-radius': '50%',display: 'inline-block'}"></span>
                      </td>
                  <td class="px-4 py-3">
<a (click)="openModalUpdate(statut.id)" class="cursor-pointer">
  <span class="relative px-1 py-2.5 rounded-md">
    <box-icon name="edit" color="gray" size="s"></box-icon>
  </span>
</a>
<app-update-statut
  [show]="showUpdateModal"
  [statut]="selectedStatut"
  (close)="closeUpdateModal()"
  (save)="handleUpdate($event)">
</app-update-statut>
<a (click)="openModalSupp(statut.id)" class="cursor-pointer">
  <span class="relative px-1 py-2.5 rounded-md">
    <box-icon name="trash" type="solid" color="rgb(252, 161, 81)" size="s"></box-icon>
  </span>
</a>
<app-supp-statut
  *ngIf="showModalSupp && selectedStatutId !== null"
  [statutId]="selectedStatutId"
  (confirmDelete)="supprimerStatut($event)"
  (cancel)="showModalSupp = false">
</app-supp-statut>


                      </td>
                    </tr>
                </tbody>
                </table>
            </div>
           <app-pagination
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChanged)="onPageChanged($event)"
  ></app-pagination>
        </div>
    </div>
  </section>
