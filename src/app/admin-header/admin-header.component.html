<header class="text-gray-600 body-font sticky z-50 bg-white top-0 shadow-lg">
    <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center">
<img
  itemprop="image"
  class="logo-scroll"
  src="https://asmpos.com/wp-content/uploads/2023/01/logo-asmpos-noir60-2.png"
  alt="Caisse tactile Tunisie – ASM"
  style="width: 120px; height: auto;"
>
      <nav class="md:ml-auto md:mr-auto flex flex-wrap items-center text-base justify-center">

 <a routerLink="/dashboard" routerLinkActive="active-link" class="mr-5 font-[500] hover:text-amber-600">Dashboard</a>
        <a routerLink="/statuts "routerLinkActive="active-link" class="mr-5 font-[500] hover:text-amber-600">Statuts</a>
        <a routerLink="/users" routerLinkActive="active-link" class="mr-5 font-[500] hover:text-amber-600">Users</a>  
      </nav>
   
 <div class="relative ml-4 mr-2" (click)="toggleDropdown()" tabindex="0" (blur)="closeDropdown()">
  <a href="#" aria-label="Mon compte" (click)="$event.preventDefault()">
    <i
      class="fas fa-user-circle fa-2x transition-colors duration-300 cursor-pointer"
      [ngClass]="{ 'text-amber-600': showDropdown, 'text-gray-700': !showDropdown }"
    ></i>
  </a>

  <!-- Dropdown Menu -->
  <div
    *ngIf="showDropdown"
    class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-lg shadow-md z-50"
  >
    <button
      (click)="logout()"
      class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-amber-100"
    >
      Se déconnecter
    </button>
  </div>
</div>


    </div>
  </header>
